mybatis:
  # 实体类别名包（简化 XML 中 resultType 写法）
  type-aliases-package: com.asule.springbootreview.bean
  # Mapper XML 文件位置（XML 版需要配置）
  mapper-locations: classpath:mappers/*.xml
  # 开启驼峰命名自动转换（如数据库 user_name → 实体类 userName）
  configuration:
    map-underscore-to-camel-case: true
    # 打印 SQL 日志（调试用）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
